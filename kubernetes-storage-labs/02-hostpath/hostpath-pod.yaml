
apiVersion: v1
kind: Pod

metadata:
  name: hostpath-demo

spec:
  containers:
    - name: hostpath-container
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]

      volumeMounts:
        - name: host-storage
          mountPath: /data

  volumes:
    - name: host-storage
      hostPath:
        path: /tmp/hostpath-demo
        type: DirectoryOrCreate
