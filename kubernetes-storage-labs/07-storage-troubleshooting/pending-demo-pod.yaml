apiVersion: v1
kind: Pod
metadata:
  name: pending-demo-pod
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "echo Storage provisioned successfully > /data/demo.txt && sleep 3600"]
      volumeMounts:
        - name: storage
          mountPath: /data
  volumes:
    - name: storage
      persistentVolumeClaim:
        claimName: pending-demo-pvc